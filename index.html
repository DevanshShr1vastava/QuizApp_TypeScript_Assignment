<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <h1>Quiz App</h1>
    <hr>
    <h2>Total Points : <span id='point-counter'>0</span></h2>
    <div id="quiz-container" class="container">
        <div class="row">
            <div class="card">
                <div class="card-header">
                    Question 1
                </div>
                <div id='question-box' class="card-body">
                    <h5 id='question-title' class="card-title">
                        Question Here
                    </h5>
                    <div id="option-box" class="form-check">
                        Options here
                    </div>
                </div>
                <div class="card-footer">
                    <div class="row mb-2">
                        <button id="next-question-primary" class="btn btn-outline-light">Next Question</button>
                    </div>
                </div>
            </div>
        </div>

        
        
        <div class="row mt-4">
            <button id="reset-quiz-button" class="btn btn-outline-warning">Reset Quiz</button>
        </div>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script type="module" src="./dist/main.js"></script>
</html>
